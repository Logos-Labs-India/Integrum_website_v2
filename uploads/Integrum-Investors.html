<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Integrum Energy — Investor Relations</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ===== styles.css ===== */
/* ============================================================
   INTEGRUM ENERGY — Stakeholder-first website
   LIGHT THEME · blue primary + solar-yellow secondary
   Design tokens + base + shared component styles
   ============================================================ */

:root {
  /* brand */
  --navy:        #012E4A;
  --navy-700:    #013A5E;
  --navy-600:    #024D77;
  --canvas:      #F5F7F9;   /* cool off-white page */
  --paper:       #FFFFFF;
  --paper-2:     #E6EFF7;   /* soft blue-tinted surface */

  /* PRIMARY ACCENT — exact brand deep blue #014976. Names kept as --amber*
     so every reference recolors in one place (Tweaks panel overrides live). */
  --amber:       #014976;   /* brand deep blue */
  --amber-deep:  #013A5E;   /* darker blue — emphasis on white */
  --amber-soft:  #D8E7F1;   /* soft blue tint */

  /* logo-derived secondaries */
  --solar:       #FFCE03;   /* brand golden yellow */
  --solar-deep:  #E0B400;
  --solar-soft:  #FFF3C2;
  --logo-blue:   #014976;   /* brand deep blue — stat numbers */
  --green:       #1D9E75;
  --green-soft:  #DDF1E9;

  /* ink */
  --ink:         #0B2036;
  --ink-2:       #435769;
  --ink-3:       #6C7E90;
  --hairline:    rgba(1,73,118,.12);
  --hairline-2:  rgba(1,73,118,.20);
  --gray-100:    #E6E8EA;

  /* surfaces */
  --bg:          var(--canvas);
  --surface:     var(--paper);
  --surface-2:   var(--paper-2);
  --dark-surface:#0B2038;

  /* persona accents (lane tints) */
  --p-cni:       #005B96;
  --p-investor:  #2E72E6;
  --p-customer:  #004A7A;
  --p-partner:   #F2664B;
  --accent:      var(--amber);
  --accent-deep: var(--amber-deep);
  --accent-soft: var(--amber-soft);

  /* type */
  --font-display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --font-sans:    "Hanken Grotesk", system-ui, -apple-system, sans-serif;

  /* radii + shadow */
  --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;
  --sh-1: 0 1px 2px rgba(11,32,56,.06), 0 2px 8px rgba(11,32,56,.05);
  --sh-2: 0 8px 30px rgba(11,32,56,.10), 0 2px 8px rgba(11,32,56,.05);
  --sh-3: 0 24px 60px rgba(11,32,56,.16), 0 8px 24px rgba(11,32,56,.08);

  /* layout */
  --maxw: 1440px;
  --gutter: clamp(20px, 5vw, 72px);
  --nav-h: 72px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; overflow-x: hidden; }
body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-size: 16px;
  line-height: 1.6;
}
h1,h2,h3,h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.04; letter-spacing: -0.025em; margin: 0; color: var(--ink); text-wrap: balance; }
h1 { font-weight: 700; letter-spacing: -0.035em; }
p { margin: 0; text-wrap: pretty; }
a { color: var(--accent-deep); text-decoration: none; }
a:hover { color: var(--amber); }
button { font-family: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1, "lnum" 1; }
::selection { background: var(--solar); color: #1F1604; }

/* ---------- layout helpers ---------- */
.shell { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); }
.section { padding-block: clamp(48px, 6vw, 92px); }
.eyebrow {
  font-family: var(--font-sans);
  font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--accent-deep); display: inline-flex; align-items: center; gap: 10px;
}
.eyebrow::before { content:""; width: 22px; height: 2px; border-radius:2px; background: var(--solar); display:inline-block; flex: none; }
.eyebrow-light { color: var(--solar); }
.eyebrow-light::before { background: var(--solar); }
.muted { color: var(--ink-2); }
.t3 { color: var(--ink-3); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-sans); font-weight: 600; font-size: 15px;
  padding: 14px 22px; border-radius: 999px; border: 1px solid transparent;
  transition: transform .15s ease, background .2s ease, box-shadow .2s ease, border-color .2s, color .2s;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
/* PRIMARY: brand blue → warms to solar-yellow on hover (Sign in, Talk to advisor, etc.) */
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 34%, transparent); }
.btn-primary:hover { background: var(--solar); color: #1F1604; box-shadow: 0 10px 26px rgba(245,184,28,.42); }
/* NAV CTA: solar-yellow by default → deep brand blue on hover/focus */
.btn-nav-cta { background: var(--solar); color: #1F1604; box-shadow: 0 6px 18px rgba(245,184,28,.36); }
.btn-nav-cta:hover, .btn-nav-cta:focus-visible { background: var(--accent); color: #fff; box-shadow: 0 10px 26px color-mix(in srgb, var(--accent) 38%, transparent); }
.btn-dark { background: var(--navy); color: #fff; }
.btn-dark:hover { background: var(--solar); color: #1F1604; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--hairline-2); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent-deep); background: var(--amber-soft); }
/* ghost button tuned for dark sections — warms to solar on hover */
.btn-ghost-light { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.38); }
.btn-ghost-light:hover { background: var(--solar); color: #1F1604; border-color: var(--solar); box-shadow: 0 10px 26px rgba(245,184,28,.34); }
.btn-lg { padding: 17px 30px; font-size: 16px; }
.btn-arrow svg { transition: transform .2s ease; }
.btn-arrow:hover svg { transform: translateX(3px); }

/* link with arrow */
.link-arrow { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--accent-deep); font-size: 15px; }
.link-arrow:hover { color: var(--amber); }
.link-arrow svg { transition: transform .2s; }
.link-arrow:hover svg { transform: translateX(4px); }

/* ---------- chips / badges ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 500; color: var(--ink-2);
  padding: 7px 13px; border: 1px solid var(--hairline-2); border-radius: 999px;
  background: var(--surface);
}
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); position: relative; flex: none; }
.pulse-dot::after { content:""; position:absolute; inset:-4px; border-radius:50%; border:1.5px solid var(--green); animation: ping 1.8s ease-out infinite; }
@keyframes ping { 0%{transform:scale(.6);opacity:.9} 100%{transform:scale(2.1);opacity:0} }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-lg); box-shadow: var(--sh-1); }

/* ---------- nav ---------- */
.nav {
  position: sticky; top: 0; z-index: 60; height: var(--nav-h);
  display: flex; align-items: center;
  background: rgba(255,255,255,.86);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid transparent; transition: border-color .3s, background .3s, box-shadow .3s;
}
.nav.scrolled { border-bottom-color: var(--hairline); box-shadow: 0 1px 14px rgba(11,32,56,.05); }
.nav-inner { display: flex; align-items: center; gap: 28px; width: 100%; }
.nav-logo { display: flex; align-items: center; gap: 11px; font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: -.02em; }
.nav-links { display: flex; gap: 4px; margin-left: 8px; }
.nav-links a { font-size: 14.5px; font-weight: 500; color: var(--ink-2); padding: 8px 13px; border-radius: 9px; transition: color .15s, background .15s; }
.nav-links a:hover { color: var(--ink); background: var(--amber-soft); }
.nav-links a.active { color: var(--accent-deep); font-weight: 600; }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.nav-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-3); appearance: none; -webkit-appearance: none; background: transparent; border: 1px solid var(--hairline); transition: .15s; }
.nav-icon:hover { color: var(--accent-deep); background: var(--amber-soft); border-color: var(--hairline-2); }
.nav-textlink { font-size: 14.5px; font-weight: 500; color: var(--ink-2); }
.nav-textlink:hover { color: var(--accent-deep); }
@media (max-width: 960px){ .nav-links, .nav-textlink { display: none; } }
@media (max-width: 760px){ .nav-right { gap: 6px; } .nav-right .btn-primary, .nav-right .btn-nav-cta { display: none; } .nav-textlink { display: none; } .brand-logo { height: 32px; } .nav-gptw { height: 26px; margin-left: 7px; } .nav-inner { gap: 10px; } }
@media (max-width: 380px){ .nav-gptw { display: none; } }

/* logo mark */
.logo-mark { width: 30px; height: 30px; flex: none; }
.brand-logo { height: 42px; width: auto; display: block; }
.brand-chip { background: #fff; border-radius: 10px; padding: 8px 12px; display: inline-flex; align-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.brand-chip img { height: 28px; width: auto; display: block; }

/* ---------- footer ---------- */
.footer { background: var(--navy); color: #C9D6E4; padding-block: 72px 36px; margin-top: 0; }
.footer h5 { font-family: var(--font-sans); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #7C93AC; font-weight: 600; margin: 0 0 16px; }
.footer-grid { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 40px 32px; }
.footer-col a { display: block; color: #AFC0D2; font-size: 14px; padding: 5px 0; transition: color .15s; }
.footer-col a:hover { color: var(--solar); }
.footer-badges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.fbadge { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: #C9D6E4; border: 1px solid rgba(255,255,255,.16); border-radius: 7px; padding: 7px 11px; display:inline-flex; gap:7px; align-items:center; }
/* social row */
.footer-social { display: flex; gap: 10px; margin-top: 22px; }
.fsoc { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; color: #C9D6E4; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.03); transition: .18s; }
.fsoc:hover { color: #0B2038; background: var(--solar); border-color: var(--solar); transform: translateY(-2px); }
.footer-base { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-top: 52px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.10); font-size: 13px; color: #7C93AC; }
.footer-base a { color: #AFC0D2; }
.footer-base a:hover { color: var(--solar); }
@media (max-width: 860px){ .footer-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px){ .footer-grid { grid-template-columns: 1fr; } }

/* ---------- reveal on scroll ---------- */
.reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce){ .reveal { opacity:1; transform:none; } html{scroll-behavior:auto;} }

/* ---------- page transition ---------- */
.page-fade { animation: pageIn .45s cubic-bezier(.2,.7,.2,1); }
@keyframes pageIn { from { transform: translateY(10px);} to { transform:none;} }

/* ===== components.css ===== */
/* ============================================================
   INTEGRUM — component styles (hero, router, sections, lanes)
   LIGHT THEME
   ============================================================ */

/* ============================================================
   V2 STRUCTURE — immersive hero, stat bar, bento, spark spine
   ============================================================ */
.btn-solar { background: var(--solar); color:#1F1604; box-shadow: 0 8px 22px rgba(255,206,3,.34); }
.btn-solar:hover { background:#fff; color:#013049; box-shadow: 0 12px 28px rgba(255,255,255,.28); }

/* ---- full-bleed video hero (turbine bg) ---- */
.hero-l { position:relative; overflow:clip; color:#EAF2F8; background:#01344f; display:flex; align-items:center; padding-block: clamp(46px,6vw,92px); min-height:min(calc(100svh - var(--nav-h)), 940px); }
.hero-l .photo-bg { z-index:0; }
.hero-l-inner { position:relative; z-index:1; width:100%; display:grid; grid-template-columns:1fr .96fr; gap:clamp(28px,4vw,60px); align-items:center; }
@media (max-width:1000px){ .hero-l-inner { grid-template-columns:1fr; gap:36px; } }
.hero-l-copy { max-width:620px; }
.chip-eyebrow { display:inline-flex; align-items:center; gap:9px; font-size:12.5px; font-weight:600; letter-spacing:.02em; color:#EAF2F8; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.22); padding:8px 15px; border-radius:999px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
.hero-l h1 { font-size:clamp(42px,6vw,80px); line-height:.95; letter-spacing:-.045em; margin-top:22px; color:#fff; text-wrap:balance; }
.hl-underline { position:relative; white-space:nowrap; color:var(--solar); }
.hl-plain { color:var(--solar); }
.hero-l-sub { color:#B9CDDE; font-size:clamp(16px,1.25vw,18.5px); line-height:1.62; margin-top:20px; max-width:520px; }
.hero-l-cta { display:flex; gap:14px; flex-wrap:wrap; margin-top:28px; }
.hero-mw-ticker { display:inline-flex; align-items:center; gap:9px; margin-top:20px; font-size:13.5px; color:#EAF2F8; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:9px 16px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
.hero-mw-ticker strong { color:var(--solar); font-family:var(--font-display); font-weight:700; letter-spacing:-.01em; }
.hero-l-stats { display:flex; gap:clamp(18px,2.4vw,40px); margin-top:34px; flex-wrap:nowrap; }
.hxs { min-width:0; }
.hxs-v { font-family:var(--font-display); font-weight:700; font-size:clamp(30px,3.2vw,48px); color:#fff; line-height:1; letter-spacing:-.02em; white-space:nowrap; }
.hxs-v .u { font-size:.46em; color:var(--solar); margin-left:4px; }
.hxs-k { font-size:clamp(11px,1vw,13.5px); color:#B9CDDE; margin-top:8px; text-transform:uppercase; letter-spacing:.1em; font-weight:600; white-space:nowrap; }
.hero-l-media { display:flex; justify-content:flex-end; }
.hero-l-live { width:100%; max-width:none; }
.hero-l-live .counter-card { width:100%; padding:44px 30px 40px; box-shadow:0 40px 90px rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.12); }
@media (max-width:1000px){ .hero-l-media { justify-content:stretch; } .hero-l-live { max-width:560px; } }

/* ---- raised stat bar (overlaps hero) ---- */
.statbar-sec { background:var(--canvas); padding-bottom:clamp(22px,3vw,44px); }
.statbar { display:grid; grid-template-columns:repeat(4,1fr); background:#fff; border:1px solid var(--hairline); border-radius:var(--r-lg); box-shadow:var(--sh-3); margin-top:-52px; position:relative; z-index:3; overflow:hidden; }
@media (max-width:700px){ .statbar { grid-template-columns:1fr 1fr; } }
.statbar-item { padding:clamp(22px,2.6vw,34px); border-right:1px solid var(--hairline); }
.statbar-item:last-child { border-right:none; }
@media (max-width:700px){ .statbar-item:nth-child(2n){ border-right:none; } .statbar-item:nth-child(-n+2){ border-bottom:1px solid var(--hairline); } }
.sb-n { font-family:var(--font-display); font-weight:600; font-size:clamp(30px,3.4vw,44px); letter-spacing:-.03em; color:var(--logo-blue); line-height:1; }
.sb-n .u { color:var(--solar-deep); font-size:.5em; }
.sb-s { color:var(--ink-2); font-size:13.5px; margin-top:10px; line-height:1.45; }
.trust-marquee { display:flex; align-items:center; gap:clamp(16px,3vw,36px); flex-wrap:wrap; margin-top:clamp(28px,3vw,42px); }
.tm-label { font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; color:var(--ink-3); white-space:nowrap; }
.tm-row { display:flex; flex-wrap:wrap; gap:12px 26px; flex:1; }
.tm-item { display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--ink-2); }
.tm-item svg { color:var(--amber); opacity:.7; }

/* ---- bento mosaic (outcomes) ---- */
.bento { display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:212px; gap:16px; margin-top:44px; }
.bento-tile { position:relative; overflow:hidden; border-radius:var(--r-lg); cursor:pointer; box-shadow:var(--sh-1); }
.bento-tile img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .6s cubic-bezier(.2,.7,.2,1); }
.bento-tile:hover img { transform:scale(1.06); }
.bento-ov { position:absolute; inset:0; background:linear-gradient(180deg, rgba(1,44,70,.12) 0%, rgba(1,44,70,.42) 44%, rgba(1,26,43,.92) 100%); }
.bento-body { position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; padding:clamp(18px,2vw,26px); color:#fff; }
.bento-chip { align-self:flex-start; font-size:11.5px; font-weight:600; letter-spacing:.02em; background:rgba(255,255,255,.18); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); padding:6px 12px; border-radius:999px; }
.bento-spacer { flex:1; }
.bento-metric { font-family:var(--font-display); font-weight:600; letter-spacing:-.025em; color:var(--solar); line-height:1; font-size:clamp(28px,3vw,42px); }
.bento-metric.esg { color:#7FE6C0; }
.bento-ml { font-size:12.5px; color:#C6D8E7; margin-top:6px; }
.bento-body h3 { color:#fff; font-size:clamp(18px,1.6vw,23px); margin-top:12px; line-height:1.16; letter-spacing:-.01em; text-wrap:balance; }
.bento-link { display:inline-flex; align-items:center; gap:7px; font-weight:600; font-size:13.5px; color:#fff; margin-top:14px; opacity:.85; }
.bento-tile:hover .bento-link { opacity:1; }
.bento-link svg { transition:transform .2s; }
.bento-tile:hover .bento-link svg { transform:translateX(4px); }
.bt-0 { grid-column:span 2; grid-row:span 2; }
.bt-1 { grid-column:span 2; }
.bt-2 { grid-column:span 2; }
.bt-3 { grid-column:span 4; }
@media (max-width:820px){ .bento { grid-template-columns:1fr 1fr; grid-auto-rows:200px; } .bt-0 { grid-column:span 2; grid-row:span 2; } .bt-1,.bt-2 { grid-column:span 1; } .bt-3 { grid-column:span 2; } }
@media (max-width:560px){ .bento { grid-template-columns:1fr; } .bt-0,.bt-1,.bt-2,.bt-3 { grid-column:span 1; grid-row:auto; } .bt-0 { min-height:300px; } }

/* ---- what we do ---- */
.wwd-sec { background:var(--surface); }
.wwd-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:clamp(28px,3vw,44px); }
@media (max-width:860px){ .wwd-grid { grid-template-columns:1fr; } }
.wwd-card { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:28px 26px; box-shadow:var(--sh-1); transition:transform .2s, box-shadow .2s, border-color .2s; }
.wwd-card:hover { transform:translateY(-4px); box-shadow:var(--sh-2); border-color:color-mix(in srgb,var(--accent) 34%,var(--hairline)); }
.wwd-ico { width:52px; height:52px; border-radius:14px; display:grid; place-items:center; color:var(--accent-deep); background:var(--amber-soft); }
.wwd-card h3 { font-size:19px; letter-spacing:-.015em; line-height:1.2; margin-top:18px; }
.wwd-card p { font-size:14.5px; color:var(--ink-2); line-height:1.6; margin-top:12px; }
.wwd-grid-4 { grid-template-columns:repeat(4,1fr); }
@media (max-width:1040px){ .wwd-grid-4 { grid-template-columns:1fr 1fr; } }
@media (max-width:620px){ .wwd-grid-4 { grid-template-columns:1fr; } }
.wwd-foot { display:inline-flex; align-items:center; gap:10px; margin-top:22px; padding:14px 22px; border-radius:999px; background:var(--amber-soft); border:1px solid color-mix(in srgb,var(--accent) 34%,transparent); font-family:var(--font-display); font-weight:600; font-size:16px; color:var(--ink); }
.wwd-foot svg { color:var(--accent-deep); flex:none; }
.wwd-foot-center { display:flex; width:fit-content; margin-inline:auto; }
.wwd-card.is-link { cursor:pointer; }
.wwd-card.is-link:hover h3 { color:var(--accent-deep); }
.sb-n .u.u-big { font-size:.72em; }

/* ---- calculator disclaimer ---- */
.ss-disclaimer { font-size:12.5px; color:var(--ink-3); line-height:1.5; margin-top:16px; padding-top:14px; border-top:1px solid var(--hairline); }

/* ---- measured outcomes (context / intervention / outcome) ---- */

  color: var(--ink); font-size: clamp(36px, 5vw, 62px); line-height: 1.0;
  letter-spacing: -.035em; margin-top: 18px; text-wrap: balance;
}
.hero-cine h1 .accent-word { color: var(--accent-deep); position: relative; }
.hero-cine h1 .accent-word::after { content:""; position:absolute; left:-.04em; right:-.04em; bottom:.06em; height:.34em; background: var(--solar); opacity:.85; border-radius:3px; z-index:-1; transform: rotate(-.4deg); }
.hero-sub.on-dark { color: var(--ink-2); max-width: 540px; margin-top: 18px; font-size: clamp(15.5px, 1.2vw, 17px); line-height: 1.6; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 26px; }

.hero-cine-stats { display: flex; gap: clamp(22px, 3vw, 44px); margin-top: 28px; flex-wrap: wrap; }
.hcstat .hcv { font-family: var(--font-display); font-weight: 600; letter-spacing: -.02em; font-size: clamp(26px, 2.6vw, 34px); color: var(--logo-blue); line-height: 1; }
.hcstat .hcv .u { font-size: .5em; color: var(--solar-deep); margin-left: 3px; font-weight: 600; }
.hcstat .hck { font-size: 12.5px; color: var(--ink-3); margin-top: 7px; max-width: 150px; line-height: 1.35; }

.hero-cine-aside { display: flex; }
.hero-cine-aside .counter-card { width: 100%; box-shadow: 0 30px 70px rgba(11,32,56,.28); border: 1px solid rgba(255,255,255,.09); }

.hero-scroll-hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink-3);
  font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; pointer-events: none;
  animation: hintBob 2.2s ease-in-out infinite; }
@keyframes hintBob { 0%,100%{ transform: translate(-50%,0);} 50%{ transform: translate(-50%,6px);} }
@media (max-width: 1000px){ .hero-scroll-hint { display: none; } }
@media (prefers-reduced-motion: reduce){ .hero-scroll-hint { animation: none; } }

/* ===== PERSONA ROUTER BAND (own light band under hero) ===== */
.router-band { padding-block: clamp(30px, 3.4vw, 46px); background: var(--surface-2); border-block: 1px solid var(--hairline); position: relative; scroll-margin-top: 80px; }
.router-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.router-head .hrh-eyebrow { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#7A5A02; background: var(--solar-soft); border:1px solid color-mix(in srgb, var(--solar) 40%, transparent); padding:6px 12px; border-radius:999px; }
.router-head .rh-title { font-family: var(--font-display); font-weight: 600; font-size: clamp(22px, 2.3vw, 30px); letter-spacing: -.02em; }
.router-head .rh-note { font-size: 13.5px; color: var(--ink-3); margin-left: auto; }
@media (max-width: 660px){ .router-head .rh-note { margin-left: 0; width: 100%; } }
.prouter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 900px){ .prouter-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 540px){ .prouter-grid { grid-template-columns: 1fr; } }

.prouter {
  position: relative; text-align: left; background: var(--surface);
  border: 1px solid var(--hairline-2); border-radius: var(--r-md);
  padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;
  transition: transform .2s cubic-bezier(.2,.7,.2,1), box-shadow .22s, border-color .2s;
  min-height: 178px;
}
.prouter::before { content:""; position:absolute; left:0; right:0; top:0; height:3px; background: var(--p-color); transform: scaleX(0); transform-origin: left; transition: transform .28s ease; }
.prouter:hover { transform: translateY(-5px); box-shadow: var(--sh-2); border-color: color-mix(in srgb, var(--p-color) 55%, var(--hairline-2)); }
.prouter:hover::before, .prouter.is-active::before { transform: scaleX(1); }
.prouter.is-active { border-color: var(--p-color); box-shadow: var(--sh-2); }
.prouter-top { display:flex; align-items:flex-start; justify-content: space-between; }
.prouter-ico { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; color: var(--p-color); background: color-mix(in srgb, var(--p-color) 12%, transparent); transition: .22s; }
.prouter:hover .prouter-ico { background: var(--p-color); color: #fff; }
.prouter.primary { background: linear-gradient(165deg, var(--amber-soft), var(--surface) 62%); }
.prouter h3 { font-size: 20px; letter-spacing: -.02em; line-height: 1.08; }
.prouter .p-tag { font-size: 13px; color: var(--ink-3); margin-top: 5px; }
.prouter .p-foot { margin-top: auto; display:inline-flex; align-items:center; gap:7px; font-size: 13px; font-weight: 600; color: var(--p-color); }
.prouter .p-foot svg { transition: transform .2s; }
.prouter:hover .p-foot svg { transform: translateX(4px); }
.prouter .p-badge { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #4A3702; background: var(--solar); border-radius: 6px; padding: 4px 9px; align-self: flex-start; white-space: nowrap; }
/* hover popover — replaces the old two-click select/continue flow */
.prouter { overflow: visible; }
.prouter-pop { position: absolute; left: 12px; right: 12px; bottom: calc(100% + 10px); z-index: 20; display: flex; flex-direction: column; gap: 7px; text-align: left; padding: 14px 16px; border-radius: 14px; background: linear-gradient(158deg, var(--p-color), color-mix(in srgb, var(--p-color) 76%, #000)); color: #fff; box-shadow: 0 18px 44px rgba(11,32,56,.34); opacity: 0; visibility: hidden; transform: translateY(6px); transition: opacity .18s ease, transform .18s ease, visibility .18s; pointer-events: none; }
.prouter-pop::after { content: ""; position: absolute; left: 26px; top: 100%; border: 7px solid transparent; border-top-color: color-mix(in srgb, var(--p-color) 76%, #000); }
.prouter:hover .prouter-pop, .prouter:focus-visible .prouter-pop { opacity: 1; visibility: visible; transform: translateY(0); }
.prouter-pop .pp-line { font-size: 13.5px; line-height: 1.5; font-weight: 500; }
.prouter-pop .pp-next { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #fff; opacity: .82; }
@media (hover: none){ .prouter-pop { display: none; } }

/* promise strip under the band */
.router-promise { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-top:16px; padding:16px 20px; border-radius: var(--r-md); background: var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.router-promise .rp-line { font-weight: 600; color: var(--ink); font-size: 15.5px; line-height: 1.4; }
.router-promise .rp-next { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; }

/* ===== live counter card (KEPT DARK — the live platform tab) ===== */
.counter-card {
  background: var(--navy); color: #EAF1F8; border-radius: var(--r-xl); padding: 24px 26px 20px;
  position: relative; overflow: hidden; box-shadow: var(--sh-3);
}
.counter-card > *:not(.photo-bg) { position: relative; z-index: 1; }
.counter-card::before { content:""; position:absolute; inset:0; z-index:0; background:
  radial-gradient(120% 80% at 100% 0%, rgba(0,91,150,.34), transparent 55%),
  radial-gradient(90% 70% at 0% 100%, rgba(29,158,117,.14), transparent 55%); pointer-events:none; }
.cc-head { display:flex; justify-content: space-between; align-items:center; }
.cc-live { display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#9FE1CB; }
.cc-big { font-family: var(--font-display); font-weight: 600; letter-spacing: -.03em; line-height: 1; }
.cc-n1 { font-size: clamp(40px, 5.4vw, 54px); }
.cc-n2 { font-size: clamp(26px, 3.2vw, 34px); }
.cc-unit { font-size: .42em; color: #9FB7CF; font-weight: 500; margin-left: 6px; letter-spacing: 0; }
.cc-label { color: #8FA8C0; font-size: 13.5px; margin-top: 4px; max-width: 280px; }
.cc-divider { height: 1px; background: rgba(255,255,255,.12); margin: 18px 0; }
.cc-sources { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
.cc-src-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.cc-src-k { font-size: 12px; color: #8FA8C0; font-weight: 500; }
.cc-src-v { font-size: 13.5px; color: #EAF1F8; font-weight: 600; font-family: var(--font-display); }
.cc-src-bar { height: 5px; border-radius: 999px; background: rgba(255,255,255,.12); margin-top: 7px; overflow: hidden; }
.cc-src-bar > div { height: 100%; border-radius: 999px; transition: width .6s ease; }
.cc-co2row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.cc-co2row .spark-svg { width: 150px; flex: none; margin-top: 0; }
.cc-foot { display:flex; align-items:center; justify-content: space-between; gap:8px; color:#8AA0B8; font-size: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.10); }
.cc-foot > span:first-child { display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
.cc-foot-link { display:inline-flex; align-items:center; gap:6px; color:#7FC4F0; font-weight:600; cursor:pointer; transition:.15s; white-space:nowrap; }
.cc-foot-link:hover { color:#fff; }
.cc-foot-link svg { transition: transform .2s; }
.cc-foot-link:hover svg { transform: translateX(3px); }
.spark-svg { width: 100%; height: 50px; display:block; margin-top: 10px; }

/* ===== PROOF BAND — deep-blue ribbon ===== */
.band-proof { background: linear-gradient(155deg, #014976 0%, #013049 100%); color:#EAF2F8; border:none; padding-block: clamp(48px,5.5vw,80px); position:relative; overflow:hidden; }
.band-proof::before { content:""; position:absolute; inset:0; background: radial-gradient(60% 80% at 92% 6%, rgba(255,206,3,.16), transparent 58%), radial-gradient(50% 70% at 4% 100%, rgba(95,180,235,.16), transparent 60%); pointer-events:none; }
.band-proof > .shell { position:relative; z-index:1; }
.band-proof .eyebrow { color:#BFD8EC; }
.proof-shell { display: grid; grid-template-columns: .85fr 1.15fr; gap: clamp(28px,4vw,64px); align-items: center; }
@media (max-width: 900px){ .proof-shell { grid-template-columns: 1fr; gap: 28px; } }
.proof-lead h2 { font-size: clamp(26px,3vw,38px); letter-spacing:-.03em; margin-top:14px; line-height:1.08; color:#fff; }
.band-proof .proof-lead .muted { color:#A9C4DC; }
.proof-stats { display: grid; grid-template-columns: repeat(4,1fr); }
@media (max-width: 560px){ .proof-stats { grid-template-columns: 1fr 1fr; gap: 26px 0; } }
.proof-stat { padding: 2px 22px; border-left: 1px solid rgba(255,255,255,.18); }
.proof-stat:first-child { border-left: none; padding-left: 0; }
@media (max-width: 560px){ .proof-stat { border-left: none; padding-left: 0; } }
.proof-n { font-family: var(--font-display); font-weight: 600; font-size: clamp(34px,4vw,50px); letter-spacing:-.03em; color: #fff; line-height:1; }
.proof-n .u { color: var(--solar); font-size:.5em; }
.proof-sub { color: #A9C4DC; font-size:13.5px; margin-top:10px; line-height:1.45; }
.proof-logos { display:flex; align-items:center; gap: clamp(16px,3vw,40px); margin-top: clamp(30px,4vw,52px); padding-top: clamp(24px,3vw,36px); border-top: 1px solid rgba(255,255,255,.16); flex-wrap:wrap; }
.proof-logos-label { font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; color: #8FB0CC; white-space:nowrap; }
.logo-row { display:flex; flex-wrap:wrap; gap: 12px 28px; align-items:center; flex:1; }
.logo-name { display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color: #D6E4F0; }
.logo-name svg { color: var(--solar); opacity:.9; }

/* ===== SECTION HEADERS ===== */
.sec-head { max-width: 720px; }
.sec-head .eyebrow { margin-bottom: 4px; }
.sec-head h2 { font-size: clamp(30px, 3.9vw, 48px); letter-spacing: -.035em; margin-top: 18px; line-height: 1.03; }
.sec-head .lead { font-size: 18px; color: var(--ink-2); margin-top: 18px; line-height: 1.62; max-width: 620px; }
.amber-num { color: var(--accent-deep); }

/* ===== COST CURVE + CALCULATOR ===== */
.cost-wrap { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(28px, 4vw, 56px); align-items: stretch; margin-top: clamp(28px, 3vw, 40px); }
@media (max-width: 940px){ .cost-wrap { grid-template-columns: 1fr; } }
.chart-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-lg); padding: 28px; box-shadow: var(--sh-1); }
.chart-legend { display:flex; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
.leg { display:inline-flex; align-items:center; gap:8px; font-size: 13.5px; color: var(--ink-2); font-weight: 500; }
.leg .sw { width: 20px; height: 3px; border-radius: 2px; }

/* calculator — DEEP BLUE card, yellow CTA + result highlight */
.calc { background: linear-gradient(158deg, #EEF6FD 0%, #CFE4F8 100%); border: 1px solid #BFDCF3; color: var(--ink); border-radius: var(--r-lg); padding: 30px; box-shadow: var(--sh-2); position: relative; overflow: hidden; }
.calc::before { content:""; position:absolute; inset:0; background: radial-gradient(100% 80% at 100% 0, rgba(255,255,255,.7), transparent 55%); pointer-events:none; }
.calc h3 { color: var(--ink); font-size: 24px; position: relative; letter-spacing:-.02em; }
.calc-sub { color: var(--ink-2); font-size: 14.5px; margin-top: 8px; position: relative; }
.calc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 24px; position: relative; }
.field label { display:block; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 7px; }
.field input, .field select {
  width: 100%; padding: 13px 14px; border-radius: 11px; border: 1px solid #B6D3EC;
  background: rgba(255,255,255,.75); color: var(--ink); font-family: var(--font-sans); font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.field input::placeholder { color: var(--ink-3); }
.field select option { color: #0B2036; }
.field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(1,73,118,.16); }
.calc .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 34%, transparent); }
.calc .btn-primary:hover { background: var(--solar); color: #1F1604; }
.calc-result { margin-top: 22px; border-top: 1px solid rgba(255,255,255,.16); padding-top: 22px; position: relative; }
.calc-result .k { color: #9FB7CF !important; }
.calc-result .big { font-family: var(--font-display); font-weight: 600; font-size: 38px; color: var(--solar); letter-spacing: -.02em; line-height: 1; }
.result-row { display:flex; gap: 28px; flex-wrap: wrap; margin-top: 14px; }
.result-stat .k { font-size: 12px; color: #9FB7CF; text-transform: uppercase; letter-spacing: .06em; }
.result-stat .v { font-family: var(--font-display); font-size: 22px; color: #fff; margin-top: 3px; }
.calc .link-arrow { color: var(--solar); }
.calc .link-arrow:hover { color: #fff; }
.slidein { animation: slideIn .5s cubic-bezier(.2,.7,.2,1); }
@keyframes slideIn { from { transform: translateY(14px); } to { transform:none; } }

/* ===== SPARK TIMELINE ===== */
.spark-sec { background: var(--surface-2); }
.spark-timeline { position: relative; display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin-top: clamp(30px,3.4vw,48px); }
.spark-track { position:absolute; left: 10%; right: 10%; top: 28px; height: 3px; background: var(--hairline-2); border-radius:2px; }
.spark-track-fill { height:100%; background: var(--amber); border-radius:2px; transition: width .45s cubic-bezier(.2,.7,.2,1); }
.spark-node { position: relative; background: none; border: none; padding: 0 6px; text-align: center; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; }
.spark-dot { width: 56px; height: 56px; border-radius: 50%; display:grid; place-items:center; font-family: var(--font-display); font-weight:700; font-size:24px; background: var(--surface); color: var(--ink-3); border: 2px solid var(--hairline-2); transition: .25s; position:relative; z-index:1; }
.spark-node:hover .spark-dot { border-color: var(--amber); color: var(--amber-deep); transform: translateY(-2px); }
.spark-node.done .spark-dot { background: var(--amber-soft); border-color: var(--amber); color: var(--amber-deep); }
.spark-node.active .spark-dot { background: var(--amber); border-color: var(--amber); color:#fff; box-shadow: 0 8px 22px color-mix(in srgb, var(--amber) 40%, transparent); transform: scale(1.08); }
.spark-node-title { font-family: var(--font-display); font-weight:600; font-size:15px; letter-spacing:-.01em; margin-top:6px; color: var(--ink); }
.spark-node.active .spark-node-title { color: var(--amber-deep); }
.spark-node-line { font-size:12px; color: var(--ink-3); line-height:1.35; max-width: 150px; }
@media (max-width: 720px){
  .spark-timeline { grid-template-columns: 1fr 1fr; gap: 22px 8px; }
  .spark-track { display:none; }
  .spark-dot { width:48px; height:48px; font-size:20px; }
}
.spark-detail { margin-top: 26px; background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-lg); padding: 32px; box-shadow: var(--sh-1); display: grid; grid-template-columns: auto 1fr 1fr; gap: 32px; align-items: start; }
@media (max-width: 820px){ .spark-detail { grid-template-columns: 1fr; gap: 18px; } }
.spark-detail .sd-num { font-family: var(--font-display); font-size: 64px; font-weight: 700; color: var(--accent); line-height: .8; }
.sd-block h5 { font-family: var(--font-sans); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; font-weight: 600; }
.sd-block p { font-size: 15.5px; color: var(--ink-2); line-height: 1.55; }
.sd-get { color: var(--green); }

/* ===== OUTCOMES ===== */
.outcome-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 48px; }
@media (max-width: 760px){ .outcome-grid { grid-template-columns: 1fr; } }
.outcome {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-lg);
  box-shadow: var(--sh-1); transition: transform .2s, box-shadow .2s; position: relative; overflow: hidden;
  display: flex; flex-direction: column;
}
.outcome:hover { transform: translateY(-4px); box-shadow: var(--sh-2); }
.outcome:hover .outcome-photo img { transform: scale(1.05); }
.outcome-photo { position: relative; height: 168px; overflow: hidden; background: var(--surface-2); }
.outcome-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.outcome-chip { position: absolute; top: 13px; left: 13px; background: rgba(11,32,56,.72); backdrop-filter: blur(6px); color: #EAF1F8; font-size: 12px; font-weight: 600; letter-spacing: .02em; padding: 6px 12px; border-radius: 999px; }
.outcome-body { padding: 22px 26px 26px; display: flex; flex-direction: column; flex: 1; }
.o-metric { font-family: var(--font-display); font-weight: 600; font-size: 34px; letter-spacing: -.025em; line-height: 1; color: var(--logo-blue); }
.o-metric.esg { color: var(--green); }
.o-metric-label { font-size: 13.5px; color: var(--ink-3); margin-top: 7px; }
.outcome h3 { font-size: 21px; letter-spacing: -.02em; margin-top: 16px; line-height: 1.18; }
.outcome .o-foot { margin-top: auto; padding-top: 20px; }

/* editorial outcomes: featured + open row */
.outcome-featured { display:grid; grid-template-columns: 1.15fr 1fr; gap: clamp(24px,3.5vw,52px); align-items:stretch; margin-top:44px; cursor:pointer; }
@media (max-width: 820px){ .outcome-featured { grid-template-columns: 1fr; } }
.of-photo { position:relative; border-radius: var(--r-lg); overflow:hidden; min-height: 340px; background: var(--surface-2); box-shadow: var(--sh-1); }
.of-photo img { width:100%; height:100%; object-fit:cover; display:block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.outcome-featured:hover .of-photo img { transform: scale(1.05); }
.of-body { display:flex; flex-direction:column; justify-content:center; padding: 4px; }
.of-body .o-metric { line-height:.95; }
.outcome-row { display:grid; grid-template-columns: repeat(3,1fr); gap: clamp(18px,2.4vw,30px); margin-top: clamp(28px,3vw,44px); }
@media (max-width: 820px){ .outcome-row { grid-template-columns:1fr; } }
.outcome-open { background:none; border:none; box-shadow:none; transition: transform .2s; }
.outcome-open .outcome-photo { border-radius: var(--r-md); height: 190px; }
.outcome-open .outcome-body { padding: 18px 2px 0; }
.outcome-open:hover { transform: translateY(-5px); box-shadow:none; }

/* ===== COMPARISON ===== */
.compare-grid { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 16px; margin-top: 48px; }
@media (max-width: 820px){ .compare-grid { grid-template-columns: 1fr; } }
.cmp { border-radius: var(--r-lg); padding: 28px; border: 1px solid var(--hairline); background: var(--surface); }
.cmp.featured { background: linear-gradient(165deg, var(--accent), var(--accent-deep)); color: #EAF1F8; border-color: var(--accent-deep); box-shadow: var(--sh-2); }
.cmp h4 { font-size: 19px; }
.cmp.featured h4 { color: #fff; }
.cmp .cmp-tag { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

.eip-sub { display:flex; flex-direction:column; gap:16px; margin-top:22px; padding-top:22px; border-top:1px solid var(--hairline); }
.eip-subitem h5 { font-family:var(--font-display); font-weight:600; font-size:15.5px; color:var(--accent-deep); margin:0; }
.eip-subitem p { font-size:14px; color:var(--ink-2); line-height:1.6; margin-top:6px; }
.eip-tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:22px; }
.eip-tags span { font-size:12.5px; font-weight:600; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--hairline); border-radius:999px; padding:6px 12px; }
.eip-calc-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:clamp(26px,3vw,40px); }

.eip-calc-card { background:linear-gradient(158deg, #EEF6FD 0%, #DCEBF8 100%); border:1px solid #BFDCF3; border-radius:var(--r-lg); padding:28px 26px; }

.eip-calc-card p { font-size:14.5px; color:var(--ink-2); line-height:1.62; margin-top:10px; }

/* ---- People: disciplines + life-at grid ---- */
.team-disc { display:flex; flex-wrap:wrap; gap:10px; margin-top:clamp(24px,3vw,36px); }
.team-disc-chip { font-size:13.5px; font-weight:600; color:var(--accent-deep); background:var(--amber-soft); border:1px solid color-mix(in srgb,var(--accent) 26%,transparent); border-radius:999px; padding:9px 16px; }
.life-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-top:clamp(24px,3vw,36px); }
@media (max-width:900px){ .life-grid { grid-template-columns:repeat(3,1fr); } }
@media (max-width:560px){ .life-grid { grid-template-columns:1fr 1fr; } }
.life-tile { aspect-ratio:4/3; border-radius:var(--r-md); background:var(--surface-2); border:1px dashed var(--hairline-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:12px; transition:border-color .2s, background .2s; }
.life-tile:hover { border-color:var(--accent); background:var(--amber-soft); }
.life-tile-ph { color:var(--ink-3); }
.life-tile-t { font-size:13px; font-weight:600; color:var(--ink-2); line-height:1.3; }

/* ---- stat band: slightly larger, still one row ---- */
.hsp-grid { gap:14px 22px; }
.hsp-v { font-size:clamp(36px,4.7vw,66px) !important; }
.hsp-v .u { font-size:.34em; }
.hsp-l { font-size:13.5px; letter-spacing:.08em; }
@media (max-width:560px){ .hsp-v { font-size:clamp(30px,8.5vw,42px) !important; } }

/* ---- leadership: initials fallback where no photo is supplied ---- */
.leader-initials { display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:26px; color:#fff; letter-spacing:.01em; }

/* ---- CO2 avoided table ---- */
.co2-card { margin-top:clamp(26px,3vw,40px); background:#fff; border:1px solid var(--hairline); border-radius:var(--r-xl); padding:clamp(24px,3vw,34px); box-shadow:var(--sh-1); }
.co2-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.co2-head h3 { font-size:clamp(19px,2.1vw,25px); letter-spacing:-.02em; }
.co2-formula { font-size:12.5px; color:var(--ink-3); }
.co2-table-wrap { overflow-x:auto; margin-top:20px; }
.co2-table { width:100%; border-collapse:collapse; font-size:15px; }
.co2-table th { text-align:left; font-family:var(--font-sans); font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:#0B2038; background:var(--solar); padding:12px 16px; }
.co2-table th:first-child { border-radius:10px 0 0 0; }
.co2-table th:last-child { border-radius:0 10px 0 0; }
.co2-table td { padding:13px 16px; border-bottom:1px solid var(--hairline); color:var(--ink-2); }
.co2-table tbody tr:hover td { background:var(--amber-soft); }
.co2-table td:first-child { font-weight:600; color:var(--ink); }
.co2-table .ta-r { text-align:right; }
.co2-table tfoot td { background:var(--logo-blue); color:#fff; font-weight:700; border-bottom:none; }
.co2-table tfoot td:first-child { color:#fff; border-radius:0 0 0 10px; }
.co2-table tfoot td:last-child { border-radius:0 0 10px 0; }

/* ---- Solutions hero: technology teaser (replaces the calculator) ---- */
.tech-teaser { background:#fff; border:1px solid var(--hairline); border-radius:var(--r-xl); padding:clamp(22px,2.6vw,30px); box-shadow:var(--sh-2); }
.tt-k { display:inline-flex; align-items:center; font-size:11.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--accent-deep); }
.tt-list { display:flex; flex-direction:column; gap:12px; margin-top:16px; }
.tt-item { border:1px solid var(--hairline); border-radius:var(--r-md); padding:16px 18px; transition:border-color .2s, background .2s; }
.tt-item:hover { border-color:color-mix(in srgb,var(--accent) 42%,transparent); background:var(--amber-soft); }
.tt-item.is-flag { background:linear-gradient(158deg,#01344f,#012234); border-color:transparent; }
.tt-top { display:flex; align-items:center; gap:10px; }

.tt-item.is-flag .tt-name { color:#fff; }
.tt-flag { font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:#012c46; background:var(--solar); border-radius:6px; padding:4px 8px; }
.tt-item p { font-size:13.5px; color:var(--ink-2); line-height:1.55; margin-top:6px; }
.tt-item.is-flag p { color:#B9CDDE; }

/* ---- dedicated customer enquiry form ---- */
.enq-card { background:#fff; border:1px solid var(--hairline); border-radius:var(--r-xl); padding:clamp(26px,3.2vw,44px); box-shadow:var(--sh-2); scroll-margin-top:96px; }
.enq-head h3 { font-size:clamp(22px,2.6vw,32px); letter-spacing:-.025em; line-height:1.16; margin-top:14px; }
.enq-sub { font-size:15.5px; color:var(--ink-2); line-height:1.6; margin-top:12px; max-width:640px; }
.enq-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:26px; }
@media (max-width:640px){ .enq-grid { grid-template-columns:1fr; } }
.enq-f { display:block; }
.enq-f > span { display:block; font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); margin-bottom:7px; }
.enq-opt { font-style:normal; font-weight:600; text-transform:none; letter-spacing:0; color:var(--ink-3); opacity:.8; }
.enq-f input, .enq-f select, .enq-f textarea { width:100%; padding:13px 14px; border-radius:11px; border:1px solid var(--hairline-2); background:var(--surface); color:var(--ink); font-family:var(--font-sans); font-size:15px; outline:none; transition:border-color .15s, box-shadow .15s; }
.enq-f textarea { resize:vertical; }
.enq-f input::placeholder, .enq-f textarea::placeholder { color:var(--ink-3); }
.enq-f input:focus, .enq-f select:focus, .enq-f textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--amber-soft); }
.enq-f input.invalid, .enq-f select.invalid, .enq-f textarea.invalid { border-color:#D9503B; box-shadow:0 0 0 3px rgba(217,80,59,.14); }
.enq-wide { grid-column:1 / -1; }
.enq-submit { margin-top:22px; }
.enq-note { font-size:12.5px; color:var(--ink-3); margin-top:14px; }
.enq-done { text-align:center; padding:clamp(22px,3vw,40px) 0; }
.enq-tick { width:58px; height:58px; border-radius:50%; background:var(--green-soft); color:var(--green); display:grid; place-items:center; margin:0 auto 18px; }
.enq-done h3 { font-size:clamp(20px,2.3vw,27px); letter-spacing:-.02em; max-width:560px; margin:0 auto; line-height:1.2; }
.enq-done p { font-size:15.5px; color:var(--ink-2); line-height:1.6; margin-top:12px; max-width:520px; margin-inline:auto; }
/* dark-surface variant */
.enq-dark { background:linear-gradient(158deg,#01344f,#012234); border-color:rgba(255,255,255,.14); }
.enq-dark .enq-head h3, .enq-dark .enq-done h3 { color:#fff; }
.enq-dark .enq-sub, .enq-dark .enq-done p { color:#B9CDDE; }
.enq-dark .eyebrow { color:var(--solar); }
.enq-dark .enq-f > span { color:#9FC1DC; }
.enq-dark .enq-f input, .enq-dark .enq-f select, .enq-dark .enq-f textarea { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.18); color:#fff; }
.enq-dark .enq-f input::placeholder, .enq-dark .enq-f textarea::placeholder { color:#7E9BB5; }
.enq-dark .enq-f select option { color:#0B2038; }
.enq-dark .enq-f input:focus, .enq-dark .enq-f select:focus, .enq-dark .enq-f textarea:focus { border-color:var(--solar); box-shadow:0 0 0 3px rgba(245,184,28,.20); }
.enq-dark .enq-note { color:#8FB0CC; }
.enq-dark .enq-note a { color:var(--solar); }

/* ---- global: tighter section rhythm (client feedback) ---- */
.section { padding-block: clamp(34px, 4vw, 62px); }
.plat-hero-note { color:#B9CDDE; font-size:clamp(14.5px,1.15vw,16px); line-height:1.62; margin-top:20px; max-width:760px; padding-top:18px; border-top:1px solid rgba(255,255,255,.16); }
/* centred divider between sections */
.section + .section::before { content:""; display:block; width:56px; height:2px; border-radius:2px; background:var(--solar); opacity:.5; margin:0 auto clamp(22px,2.6vw,34px); }

/* ---- resume upload ---- */
.resume-drop { display:flex; align-items:center; gap:11px; margin-top:7px; padding:13px 15px; border:1px dashed var(--hairline-2); border-radius:11px; background:var(--surface); cursor:pointer; transition:border-color .18s, background .18s; }
.resume-drop:hover { border-color:var(--accent); background:var(--amber-soft); }
.resume-drop input { display:none; }
.resume-drop .rd-ic { color:var(--accent-deep); flex:none; }
.resume-drop .rd-t { font-size:14.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---- awards list ---- */
.award-list { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:clamp(22px,2.6vw,34px); }
@media (max-width:860px){ .award-list { grid-template-columns:1fr; } }
.award-item { display:flex; gap:14px; align-items:flex-start; background:#fff; border:1px solid var(--hairline); border-radius:var(--r-lg); padding:22px 20px; box-shadow:var(--sh-1); }
.ai-y { flex:none; font-family:var(--font-display); font-weight:700; font-size:13px; color:#7A5A02; background:var(--solar-soft); border:1px solid color-mix(in srgb,var(--solar) 42%,transparent); border-radius:999px; padding:5px 11px; }
.award-item h4 { font-size:16px; letter-spacing:-.015em; line-height:1.28; }
.ai-o { font-size:13px; color:var(--ink-3); margin-top:6px; }

/* ---- Solutions: tighter rhythm between outcome / risk / FAQ blocks ---- */
.sol-outcomes-sec { padding-bottom: clamp(20px,2.4vw,30px); }
.sol-outcomes-sec + .section::before { display:none; }
.tech-grid + * { margin-top:0; }

/* ---- platform + solutions: tighter section rhythm ---- */
.plat-page .section, .sol-page .section { padding-block: clamp(26px,3.2vw,48px); }
.plat-page .section + .section::before, .sol-page .section + .section::before { margin-bottom: clamp(16px,2vw,24px); }
.plat-page .sec-head .lead, .sol-page .sec-head .lead { margin-top:14px; }

/* ---- customer journey (generic platform layout) ---- */
.jrn-sec { background:#EEF6FD; }
.jrn-head { max-width:900px; }
.jrn-head h2 { font-size:clamp(26px,3.4vw,44px); letter-spacing:-.032em; line-height:1.08; margin-top:14px; }
.jrn-dot { color:var(--solar); }
.jrn-sub { font-size:15.5px; color:var(--ink-2); line-height:1.62; margin-top:14px; max-width:680px; }
.jrn-row { display:grid; grid-template-columns:1fr auto 1.06fr auto 1fr; gap:0 12px; align-items:stretch; margin-top:clamp(22px,2.6vw,34px); }
@media (max-width:960px){ .jrn-row { grid-template-columns:1fr; gap:14px; } .jrn-arrow { display:none; } }
.jrn-card { background:#fff; border:1px solid var(--hairline); border-radius:16px; padding:22px 20px; box-shadow:var(--sh-1); }
.jrn-card.is-platform { border-top:3px solid var(--solar); box-shadow:var(--sh-2); }

.jrn-n { display:block; font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--accent-deep); line-height:1; }
.is-platform .jrn-n { color:var(--solar-deep); }
.is-portfolio .jrn-n { color:var(--green); }
.jrn-t { display:block; font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); margin-top:5px; }
.jrn-list { list-style:none; padding:0; margin:14px 0 0; display:flex; flex-direction:column; gap:10px; }
.jrn-list li { display:flex; align-items:flex-start; gap:9px; font-size:13.5px; color:var(--ink-2); line-height:1.45; }
.jrn-list li::before { content:""; flex:none; width:5px; height:5px; border-radius:50%; background:var(--solar); margin-top:6px; }
.jrn-list-ic li::before { display:none; }
.jrn-list-ic .jli { flex:none; color:var(--accent-deep); display:grid; place-items:center; width:16px; margin-top:1px; }
.jrn-arrow { display:flex; align-items:center; color:var(--ink-3); }
.jrn-foot { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:16px; background:#fff; border:1px solid var(--hairline); border-radius:14px; padding:18px 22px; box-shadow:var(--sh-1); }
.jrn-foot-mark { width:42px; height:42px; flex:none; border-radius:11px; display:grid; place-items:center; color:var(--accent-deep); background:var(--amber-soft); }
.jrn-foot-brand { font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:.06em; color:var(--logo-blue); }
.jrn-foot p { flex:1 1 320px; font-size:14px; color:var(--ink-2); line-height:1.55; padding-left:16px; border-left:1px solid var(--hairline); }
@media (max-width:640px){ .jrn-foot p { padding-left:0; border-left:none; } }
.jrn-note { font-size:12px; color:var(--ink-3); text-align:center; margin-top:14px; }

/* ---- Energy Intelligence hero (light, mockup right) ---- */
.eip-hero-light { background:linear-gradient(168deg,#F4F9FE,#E9F2FB); }
.eip-hero-grid { display:grid; grid-template-columns:1fr 1.02fr; gap:clamp(26px,3.4vw,52px); align-items:center; }
@media (max-width:980px){ .eip-hero-grid { grid-template-columns:1fr; } }
.eip-h { font-size:clamp(26px,3.4vw,44px); letter-spacing:-.032em; line-height:1.06; margin-top:14px; }
.eip-p { font-size:15.5px; color:var(--ink-2); line-height:1.65; margin-top:14px; max-width:560px; }
.eip-mock { position:relative; }
.eip-mock-note { display:block; font-size:11.5px; color:var(--ink-3); text-align:right; margin-top:8px; }
.mk-win { background:#fff; border:1px solid var(--hairline); border-radius:16px; overflow:hidden; box-shadow:var(--sh-3); }
.mk-bar { display:flex; align-items:center; gap:7px; padding:11px 14px; background:var(--surface-2); border-bottom:1px solid var(--hairline); }
.mk-bar span { width:9px; height:9px; border-radius:50%; background:var(--hairline-2); }
.mk-bar em { margin-left:8px; font-style:normal; font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
.mk-body { padding:16px; display:flex; flex-direction:column; gap:14px; }
.mk-kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.mk-kpi { background:var(--surface-2); border:1px solid var(--hairline); border-radius:11px; padding:12px 13px; }
.mk-k { display:block; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
.mk-v { display:block; font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--logo-blue); margin-top:6px; letter-spacing:-.02em; }
.mk-d { display:block; font-size:11.5px; font-weight:600; color:var(--green); margin-top:3px; }
.mk-chart { border:1px solid var(--hairline); border-radius:12px; padding:14px; }
.mk-ct { font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); }
.mk-bars { display:flex; align-items:flex-end; gap:5px; height:96px; margin-top:12px; }
.mk-b { flex:1; position:relative; border-radius:4px 4px 0 0; background:var(--solar); min-height:8px; display:flex; align-items:flex-end; }
.mk-b i { display:block; width:100%; border-radius:4px 4px 0 0; background:var(--logo-blue); }
.mk-legend { display:flex; gap:16px; margin-top:11px; }
.mk-legend span { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2); }
.mk-legend i { width:12px; height:3px; border-radius:2px; }
.mk-legend .lg-a { background:var(--solar); }
.mk-legend .lg-b { background:var(--logo-blue); }
.mk-rows { display:flex; flex-direction:column; gap:8px; }
.mk-row { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12.5px; color:var(--ink-2); padding:10px 12px; background:var(--surface-2); border-radius:9px; }
.mk-row strong { color:var(--ink); font-weight:600; }

/* ---- industry panel: case hover ---- */
.ip-side .ip-case:hover { border-color:color-mix(in srgb,var(--accent) 45%,var(--hairline)); }

/* ---- company page: tighter section rhythm ---- */
.about-page .section { padding-block: clamp(26px,3.2vw,48px); }
.about-page .section + .section::before { margin-bottom: clamp(16px,2vw,24px); }
.about-page .sec-head .lead { margin-top:14px; }

/* ---- platform hero note sits inside the blue area ---- */
.plat-hero-note-in { border-top:none; padding-top:0; margin-top:16px; }
/* minimal white intersection under the SPARK band */
.plat-page .spark-sec { padding-bottom: clamp(22px,2.6vw,34px); }
.plat-page .spark-sec + .section { padding-top: clamp(18px,2.2vw,28px); }
.plat-page .spark-sec + .section::before { display:none; }

/* ---- awards: alternate the featured block, 5-up list ---- */
.award-list { grid-template-columns:repeat(5,1fr); }
@media (max-width:1100px){ .award-list { grid-template-columns:repeat(2,1fr); } }
@media (max-width:600px){ .award-list { grid-template-columns:1fr; } }
.award-feature + .award-feature, .award-feature.is-flip { margin-top:18px; }
.award-feature.is-flip { grid-template-columns:.95fr 1.05fr; }
.award-feature.is-flip .award-photo { order:2; }
.award-feature.is-flip .award-copy { order:1; padding:clamp(24px,3vw,40px) 0 clamp(24px,3vw,40px) clamp(24px,3vw,40px); }
.award-feature.is-flip .award-photo img { object-fit:cover; object-position:center 30%; }
@media (max-width:860px){ .award-feature.is-flip { grid-template-columns:1fr; } .award-feature.is-flip .award-photo { order:1; } .award-feature.is-flip .award-copy { order:2; padding:clamp(22px,3vw,32px); } }

/* ---- SPARK: platform note inside the blue band ---- */
.spark-note { font-size:14.5px; color:var(--ink-2); line-height:1.62; max-width:820px; margin-top:16px; padding:14px 18px; background:rgba(255,255,255,.66); border:1px solid var(--hairline); border-radius:12px; }

/* ---- awards: both featured photos the same height ---- */
.award-photo { min-height:0; height:100%; }
.award-feature, .award-feature.is-flip { align-items:stretch; }
.award-feature .award-photo { aspect-ratio:auto; }
.award-feature .award-photo img { height:100%; max-height:360px; }
@media (max-width:860px){ .award-feature .award-photo img { max-height:300px; } }

/* ---- global: reduce space between sections on every page ---- */
.section { padding-block: clamp(26px,3.2vw,48px); }
.section + .section::before { margin-bottom: clamp(16px,2vw,24px); }
.sec-head .lead { margin-top:14px; }

/* ---- narrow-width overflow fixes (320–420px) ---- */
/* grid tracks must be allowed to shrink below their content's min-content width */
.eip-hero-grid { grid-template-columns: minmax(0,1fr) minmax(0,1.02fr); }
@media (max-width:980px){ .eip-hero-grid { grid-template-columns: minmax(0,1fr); } }
.mk-win, .mk-body, .mk-kpis, .mk-chart { min-width:0; }
@media (max-width:520px){ .mk-kpis { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
@media (max-width:420px){ .mk-kpis { grid-template-columns: minmax(0,1fr); } }

/* ---- responsive grids previously locked by inline styles ---- */
.wwd-grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
@media (max-width:860px){ .wwd-grid-3 { grid-template-columns: minmax(0,1fr); } }
.inv-bottom { display:grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); gap:22px; margin-top:48px; }
@media (max-width:860px){ .inv-bottom { grid-template-columns: minmax(0,1fr); } }
.dl-grid-2 { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
@media (max-width:620px){ .dl-grid-2 { grid-template-columns: minmax(0,1fr); } }
.contact-grid { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:clamp(32px,5vw,64px); margin-top:20px; align-items:start; }
@media (max-width:860px){ .contact-grid { grid-template-columns: minmax(0,1fr); } }
.contact-fields { margin-top:20px; display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:14px; }
@media (max-width:520px){ .contact-fields { grid-template-columns: minmax(0,1fr); } }
/* buttons must never force the page wider than the viewport */
@media (max-width:420px){ .btn { max-width:100%; white-space:normal; text-align:center; } }

/* ---- contact form: required markers + invalid state ---- */
.req { color:#C23A26; font-weight:700; }
.opt { font-style:normal; font-weight:600; color:var(--ink-3); opacity:.85; }
.field-l input.invalid, .field-l select.invalid, .field-l textarea.invalid { border-color:#D9503B !important; box-shadow:0 0 0 3px rgba(217,80,59,.14); }

/* ---- segment leader icons ---- */
.tm-row { gap:14px 22px; }
.tm-item { gap:10px; align-items:center; }
.tm-ic { flex:none; width:26px; height:26px; display:grid; place-items:center; color:var(--accent); opacity:1; }
.tm-ic svg { width:20px; height:20px; }
.tm-item svg { color:var(--accent); opacity:1; }

/* ---- client-supplied chart images ---- */
/* the two sources have different aspect ratios, so pin a shared box and letterbox
   inside it (both have white backgrounds) — keeps the captions on one baseline */
.chart-img { margin:0; display:flex; flex-direction:column; flex:1; min-height:0; }
.chart-img img { display:block; width:100%; height:auto; border:1px solid var(--hairline); border-radius:14px; background:#fff; }
/* captions pin to the bottom of the equal-height columns, so differing image
   aspect ratios can't knock them out of alignment */
.chart-img figcaption { font-size:13px; color:var(--ink-3); line-height:1.55; margin-top:auto; padding-top:14px; }
.chart-col { display:flex; flex-direction:column; }

/* ---- segment leaders: even grid so rows align ---- */
.trust-marquee { align-items:flex-start; }
.tm-label { padding-top:6px; }
.tm-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px 20px; }
@media (max-width:1100px){ .tm-row { grid-template-columns:repeat(3,1fr); } }
@media (max-width:820px){ .tm-row { grid-template-columns:repeat(2,1fr); } }
@media (max-width:520px){ .tm-row { grid-template-columns:1fr; } }
.tm-item { align-items:center; line-height:1.35; }

/* ---- Life at Integrum: real photography ---- */
.life-photos { display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:190px; gap:14px; margin-top:clamp(20px,2.4vw,32px); }
@media (max-width:900px){ .life-photos { grid-template-columns:1fr 1fr; } }
@media (max-width:520px){ .life-photos { grid-template-columns:1fr; grid-auto-rows:220px; } }
.life-photo { position:relative; overflow:hidden; border-radius:var(--r-md); background:var(--surface-2); box-shadow:var(--sh-1); }
.life-photo.is-wide { grid-column:span 2; }
.life-photo.is-tall { grid-row:span 2; }
@media (max-width:520px){ .life-photo.is-wide, .life-photo.is-tall { grid-column:auto; grid-row:auto; } }
.life-photo img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s cubic-bezier(.2,.7,.2,1); }
.life-photo:hover img { transform:scale(1.05); }
.lp-cap { position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; gap:2px; padding:26px 14px 12px; font-size:12px; color:rgba(255,255,255,.86); line-height:1.35; background:linear-gradient(180deg, transparent, rgba(6,20,36,.82)); }
.lp-cap strong { font-family:var(--font-display); font-weight:600; font-size:14px; color:#fff; letter-spacing:-.01em; }

/* ---- Life at Integrum: complete the tiling (no empty cells) ---- */
/* 4 columns: row1 = wide(2) + tall(1, spans 2 rows) + gptw(1); row2 = hackathon wide(2) + [tall continues] + gptw? */
.life-photos { grid-template-columns:repeat(4,1fr); grid-auto-rows:190px; }
.life-photo.is-wide { grid-column:span 2; }
.life-photo.is-tall { grid-row:span 2; }
/* placeholder row: 4 columns so 8 labels make two even rows */
.life-grid { grid-template-columns:repeat(4,1fr); }
@media (max-width:900px){ .life-grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:520px){ .life-grid { grid-template-columns:1fr 1fr; } }

/* ---- Life at Integrum: 3-col grid tiles exactly (wide=2 + tall=2rows + 2 singles = 6 cells) ---- */
.life-photos { grid-template-columns:repeat(3,1fr); grid-auto-rows:200px; }
@media (max-width:900px){ .life-photos { grid-template-columns:1fr 1fr; } }
@media (max-width:520px){ .life-photos { grid-template-columns:1fr; } }
/* 6 placeholder labels → two even rows of 3 */
.life-grid { grid-template-columns:repeat(3,1fr); }
@media (max-width:900px){ .life-grid { grid-template-columns:1fr 1fr; } }
@media (max-width:520px){ .life-grid { grid-template-columns:1fr 1fr; } }

/* ---- Life at Integrum: 8 photos = 1 wide + 7 singles = 9 cells over 3 rows ---- */
.life-photo.is-tall { grid-row:auto; }
@media (max-width:900px){ .life-photo.is-wide { grid-column:span 2; } }
@media (max-width:520px){ .life-photo.is-wide { grid-column:auto; } }

/* ---- Life at Integrum: tablet — no spans, so 8 photos make 4 even rows of 2 ---- */
@media (max-width:900px){
  .life-photos { grid-template-columns:1fr 1fr; }
  .life-photo.is-wide { grid-column:auto; }
  /* 3 placeholder labels stay on one even row until single-column */
  .life-grid { grid-template-columns:repeat(3,1fr); }
}
@media (max-width:520px){
  .life-photos { grid-template-columns:1fr; }
  .life-grid { grid-template-columns:1fr; }
}

/* ---- leader cards fill their grid row (stretch stops at the Reveal wrapper) ---- */
.leader-grid > * { display:flex; }
.leader-card { height:100%; }

/* ===== pages.css ===== */
/* ============================================================
   INTEGRUM — page styles (C&I lane, Investors, Dashboard, Case)
   ============================================================ */

/* ===== shared lane hero ===== */
.lane-hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(32px,4vw,64px); align-items: center; }
@media (max-width: 940px){ .lane-hero { grid-template-columns: 1fr; } }
.lane-hero h1 { font-size: clamp(38px, 5.2vw, 64px); letter-spacing: -.035em; margin-top: 18px; line-height: 1.0; text-wrap: balance; }
.lane-hero .lead { font-size: 18.5px; color: var(--ink-2); margin-top: 20px; max-width: 520px; line-height: 1.6; }
.tagstack { display:flex; gap:10px; flex-wrap:wrap; margin-top: 26px; }

/* ===== industry tabs ===== */
.itabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.itab { font-size: 14.5px; font-weight: 600; padding: 11px 17px; border-radius: 999px; border: 1px solid var(--hairline-2); background: var(--surface); color: var(--ink-2); transition: .15s; }
.itab:hover { border-color: var(--p-color); color: var(--ink); }
.itab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.industry-panel { margin-top: 28px; display: grid; grid-template-columns: 1.24fr .96fr; gap: 22px; align-items: start; }
@media (max-width: 860px){ .industry-panel { grid-template-columns: 1fr; } }
.ip-main { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-lg); padding: 30px; box-shadow: var(--sh-1); }
.ip-stat-row { display:flex; gap: 32px; flex-wrap: wrap; margin: 22px 0; }
.ip-stat .v { font-family: var(--font-display); font-weight: 600; font-size: 32px; letter-spacing: -.02em; }
.ip-stat .v.amber { color: var(--accent-deep); } [data-theme="dark"] .ip-stat .v.amber { color: var(--amber); }
.ip-stat .k { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.ip-side { display:flex; flex-direction: column; gap: 14px; }
.ip-case { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 22px; box-shadow: var(--sh-1); transition: .2s; }
.ip-case:hover { box-shadow: var(--sh-2); transform: translateY(-3px); }
.ip-reg { font-size: 13.5px; color: var(--ink-2); display:flex; gap:10px; line-height: 1.5; }

/* ===== model compare (capex/opex/eaas) ===== */
.model-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-top: 44px; }
@media (max-width: 820px){ .model-grid { grid-template-columns: 1fr; } }
.model-card { border: 1px solid var(--hairline-2); border-radius: var(--r-lg); padding: 28px; background: var(--surface); transition: .2s; position: relative; display:flex; flex-direction:column; height:100%; }
.model-card:hover { box-shadow: var(--sh-2); border-color: var(--p-color); }
.model-card .mc-k { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--p-color); }
.model-card h4 { font-size: 22px; margin-top: 10px; }
.model-card .mc-desc { font-size: 14.5px; color: var(--ink-2); margin-top: 10px; line-height: 1.55; }
.model-card .mc-meta { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hairline); display:flex; flex-direction:column; gap: 9px; }
.model-card .mc-meta div { display:flex; justify-content: space-between; font-size: 13.5px; }
.model-card .mc-meta span:first-child { color: var(--ink-3); }
.model-card .mc-meta span:last-child { color: var(--ink); font-weight: 600; }
.model-card .mc-cta { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--hairline-2); font-size: 13.5px; color: var(--ink-2); line-height: 1.5; font-weight: 500; }

/* ===== solutions: find my solution / families / commercial ===== */
.solve-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:clamp(24px,2.6vw,36px); }
@media (max-width:900px){ .solve-row { grid-template-columns:1fr 1fr; } }
@media (max-width:480px){ .solve-row { grid-template-columns:1fr; } }
.solve-chip { text-align:left; display:flex; flex-direction:column; gap:6px; position:relative; background:var(--surface); border:1px solid var(--hairline-2); border-radius:var(--r-md); padding:20px 22px; cursor:pointer; transition:transform .18s, box-shadow .18s, border-color .18s; }
.solve-chip:hover { transform:translateY(-3px); box-shadow:var(--sh-2); border-color:var(--accent); }
.sv-k { font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--ink); letter-spacing:-.015em; }
.sv-d { font-size:13.5px; color:var(--ink-2); }
.sv-go { position:absolute; top:18px; right:18px; color:var(--accent-deep); }
.fam-title { font-size:clamp(20px,2.1vw,26px); letter-spacing:-.02em; margin-top:clamp(34px,3.6vw,48px); }
.fam-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:18px; }
